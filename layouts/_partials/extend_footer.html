{{- /* Mobile menu toggle: built in JS so the theme's header.html needs no override. Styles: assets/css/extended/portfolio-redesign.css */ -}}
<script>
    (function () {
        var main = document.querySelector('main.main');
        if (main) {
            main.id = main.id || 'main-content';
            var skip = document.createElement('a');
            skip.className = 'skip-link';
            skip.href = '#' + main.id;
            skip.textContent = 'Skip to Main Content';
            document.body.insertBefore(skip, document.body.firstChild);
        }

        var themeColor = document.querySelector('meta[name="theme-color"]');
        function syncThemeColor() {
            var color = getComputedStyle(document.documentElement).getPropertyValue('--theme').trim();
            if (themeColor && color) themeColor.setAttribute('content', color);
        }
        syncThemeColor();
        new MutationObserver(syncThemeColor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        var nav = document.querySelector('.header-nav');
        var menu = document.getElementById('menu');
        if (!nav || !menu) return;

        var button = document.createElement('button');
        button.className = 'menu-toggle';
        button.type = 'button';
        button.setAttribute('aria-controls', 'menu');
        button.setAttribute('aria-expanded', 'false');
        button.innerHTML = '<span class="menu-toggle-label">Menu</span><span class="menu-toggle-icon" aria-hidden="true"></span>';
        nav.insertBefore(button, menu);

        function close() {
            nav.classList.remove('is-menu-open');
            button.setAttribute('aria-expanded', 'false');
        }

        nav.classList.add('is-menu-enhanced');
        button.addEventListener('click', function () {
            var isOpen = nav.classList.toggle('is-menu-open');
            button.setAttribute('aria-expanded', String(isOpen));
        });
        menu.addEventListener('click', function (event) {
            if (event.target.closest('a')) close();
        });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && nav.classList.contains('is-menu-open')) {
                close();
                button.focus();
            }
        });
    }());
</script>
