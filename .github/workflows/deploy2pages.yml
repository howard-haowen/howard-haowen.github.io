# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
      SITE_BASE_URL: https://hw.is-a.dev/
    steps:
      - name: Install Hugo CLI
        working-directory: ${{ runner.temp }}
        run: |
          DEB="hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          BASE="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          wget -q -O "${DEB}" "${BASE}/${DEB}"
          wget -q -O hugo_checksums.txt "${BASE}/hugo_${HUGO_VERSION}_checksums.txt"
          grep -F " ${DEB}" hugo_checksums.txt | sha256sum --check --strict -
          sudo dpkg -i "${DEB}"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${SITE_BASE_URL}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
