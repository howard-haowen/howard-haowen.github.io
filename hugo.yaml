baseURL: https://hw.is-a.dev/
languageCode: en-us
title: Haowen Jiang
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

menu:
  main:
    - identifier: profile
      name: Profile
      url: /profile/
      weight: 10
    - identifier: work
      name: Work
      url: /work/
      weight: 20
    - identifier: speaking
      name: Speaking
      url: /speaking/
      weight: 30
    - identifier: publications
      name: Publications
      url: /publications/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Haowen Jiang's portfolio website"
  keywords: [Portfolio, AI Engineering, Linguistics, Formosan Languages, Applied AI]
  author: "Haowen Jiang"
  images: ["profile.jpeg"]
  languageAltTitle: "English"
  tocopen: true
  ShowToc: true
  ShowReadingTime: false
  ShowBreadCrumbs: true
  ShowPageNums: true
  ShowPostNavLinks: true
  ShowFullTextinRSS: true
  ShowRssButtonInSectionTermList: true
  ShowCodeCopyButtons: true
  # Share buttons for social media
  ShowShareButtons: true
  ShareButtons: ["linkedin", "facebook"]
  footer:
    text: "[Archive](/archives/) · [Tags](/tags/) · [RSS](/index.xml)"
  # Page Mode
  profileMode:
    enabled: true
    title: "Dr. Haowen Jiang" # optional default will be site title
    subtitle: |
      AI engineer and linguist translating research judgment into practical data and AI systems.
    imageUrl: "profile.jpeg" # optional
    imageTitle: "Haowen Jiang at the Uji Bridge" # optional
    #imageWidth: 120 # custom size
    #imageHeight: 120 # custom size
    buttons:
    - name: Profile
      url: "/profile"
    - name: Talks
      url: "/talks"
    - name: Certifications
      url: "/certifications"
  # Optional social icons
  socialIcons:
    - name: "linkedin"
      url: "https://www.linkedin.com/in/haowen-jiang-16242074/"
    - name: "github"
      url: "https://github.com/howard-haowen"
    - name: email
      url: "mailto:howard.haowen@gmail.com"
  # Optional assets
  assets: # relative to the /static directory
  # favicon generated from https://favicon.io/favicon-generator/
  # font family: IBM Plex Mono
  # font variant: Regular 400 Italic
  # font size: 110
  # font color: #006699
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/favicon.ico"
    theme_color: "#0b3b4a" # hex color for theme color
  urls:
    shibatani: "https://profiles.rice.edu/faculty/masayoshi-matt-shibatani"
    pardeshi: "https://researchmap.jp/Prashant_Pardeshi"
    billings: "https://www.lunduniversity.lu.se/lucat/user/75c8dde3f51fc3d0fbfe2c59df33bf73"
    hengsyung: "https://www.forex.ntu.edu.tw/%E9%84%AD%E6%81%86%E9%9B%84/"
    sihwei: "https://sihweichen.wordpress.com/"
    ruiling: "http://www.lit.snnu.edu.cn/info/1026/5379.htm"
# Search Page
outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search
